    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="840" height="720" fill="#ffffff"/>
  <g fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5">
    <rect x="340" y="30" width="160" height="50" rx="8"/>
    <rect x="260" y="125" width="320" height="100" rx="8" fill="#eff6ff"/>
    <rect x="25" y="135" width="185" height="80" rx="8"/>
    <rect x="625" y="125" width="190" height="100" rx="8"/>
    <rect x="30" y="300" width="220" height="130" rx="8"/>
    <rect x="310" y="300" width="220" height="130" rx="8"/>
    <rect x="590" y="300" width="220" height="130" rx="8"/>
    <rect x="270" y="510" width="300" height="155" rx="8" fill="#f0fdf4"/>
  </g>
  <g fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M420 80 V125"/>
    <path d="M260 175 H210"/>
    <path d="M315 225 L140 300"/>
    <path d="M420 225 V300"/>
    <path d="M535 225 L700 300"/>
    <path d="M280 225 V480 H300 V510"/>
    <path d="M420 430 V510"/>
    <path d="M700 430 V585 H570"/>
    <path d="M720 300 V225"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#0f172a" text-anchor="middle">
    <g font-size="18" font-weight="600">
      <text x="420" y="62">src/index.ts</text>
      <text x="420" y="155">app</text>
      <text x="140" y="331">parser</text>
      <text x="420" y="331">command</text>
      <text x="700" y="331">io</text>
      <text x="420" y="543">model</text>
    </g>
    <g font-size="15">
      <text x="420" y="184">Repl / Editor</text>
      <text x="420" y="205">parse, validate, dispatch</text>
      <text x="117" y="168">Node.js terminal</text>
      <text x="117" y="192">readline / stdio</text>
      <text x="720" y="155">fs / crypto</text>
      <text x="720" y="183">saxes</text>
      <text x="720" y="208">@xmldom/xmldom</text>
      <text x="140" y="366">CommandParser</text>
      <text x="140" y="394">CommandToken</text>
      <text x="420" y="358">CommandHistory</text>
      <text x="420" y="385">Command / concrete classes</text>
      <text x="420" y="412">ShapeSnapshot</text>
      <text x="700" y="366">SvgReader</text>
      <text x="700" y="394">SvgSerializer</text>
      <text x="420" y="574">Shape / leaf shapes / Group</text>
      <text x="420" y="600">SvgDocument</text>
      <text x="420" y="626">ShapeFactory / SvgValue</text>
