<svg xmlns="http://www.w3.org/2000/svg" width="840" height="720" viewBox="0 0 840 720">
  <title>SVG Editor CLI module dependencies</title>
  <desc>Entry starts app. App uses parser, command, model and io. Command and io use model. Only app and io use external input/output.</desc>
